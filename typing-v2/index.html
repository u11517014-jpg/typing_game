<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英打遊戲版本一</title>
  <style>
    /* 頁面整體基礎樣式：白色背景與水平垂直置中 */
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 置中容器 */
    .container {
      text-align: center;
    }

    /* 標題樣式 */
    h1 {
      font-size: 2.2rem;
      color: #333333;
      margin-bottom: 2rem;
      font-weight: 600;
    }

    /* 開始按鈕樣式 */
    .start-btn {
      font-size: 1.1rem;
      padding: 0.75rem 2rem;
      background-color: #0066cc;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>英打遊戲版本一</h1>
    <button class="start-btn">開始</button>
  </div>


<!-- 在 v1/index.html 與 v2/index.html 的頁面中加入此連結 -->
<a href="../index.html" style="margin-top: 20px; display: inline-block;">← 返回歷程首頁</a>

</body>
</html>
